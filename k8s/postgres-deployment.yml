apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment
  namespace: ai-incident-namespace

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: database-variable
              key: DB_NAME

        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: database-variable
              key: DB_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: DB_PASSWORD

        volumeMounts:
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d

        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 10
          periodSeconds: 5

      volumes:
      - name: postgres-init
        configMap:
          name: postgres-init