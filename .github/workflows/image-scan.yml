name: Image Scanner

on:
  workflow_call:

jobs:
  imager-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Ensure Trivy DB is present and up-to-date to avoid "Need to update DB"
      - name: Update Trivy DB
        run: |
          mkdir -p ${{ github.workspace }}/.cache
          docker run --rm -v ${{ github.workspace }}/.cache:/root/.cache aquasec/trivy:latest db update

      - name: trivy scanner
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USER }}/ai-powered-incident-manager-app:${{ github.sha }}
          scan-type: image
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignorefile: ".trivyignore"