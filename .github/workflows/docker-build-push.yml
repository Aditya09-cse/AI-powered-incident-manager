name: Docker build & push

on:
  workflow_call:
    
  #push:
   # branches:
     # - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

        - name: code checkout
          uses: actions/checkout@v4
        
        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USER }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}
        
        - name: Build and push to docker hub
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ${{ vars.DOCKERHUB_USER}}/ai-powered-incident-manager-app:${{github.ref_name}}  
              ${{ vars.DOCKERHUB_USER}}/ai-powered-incident-manager-app:latest
              ${{ vars.DOCKERHUB_USER}}/ai-powered-incident-manager-app:${{ github.sha }}
