services:

  app:
    image: aditya0910/ai-powered-incident-manager-app:latest
    container_name: devops-ai-app

    ports:
      - "5001:5001"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    depends_on:
      postgres:
        condition: service_healthy

      ollama:
        condition: service_started

    networks:
      - app-network

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine

    container_name: devops-ai-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest

    container_name: devops-ai-ollama

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - app-network

    restart: unless-stopped


volumes:

  postgres-data:

  ollama-data:


networks:

  app-network:
    driver: bridge
