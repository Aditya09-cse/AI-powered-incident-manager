<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps AI Incident Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <header>
        <h1>DevOps AI Incident Manager</h1>
        <p>
            PostgreSQL + Flask + Ollama
        </p>
    </header>


    <section class="card">

        <h2>Create Incident</h2>

        <input
            id="title"
            placeholder="Incident title"
        >

        <textarea
            id="description"
            placeholder="Describe the infrastructure problem..."
        ></textarea>

        <button onclick="createIncident()">
            Create Incident
        </button>

    </section>


    <section>

        <h2>Incidents</h2>

        <div id="incidents"></div>

    </section>

</div>


<script>

async function loadIncidents() {

    const response = await fetch("/api/incidents");

    const incidents = await response.json();

    const container =
        document.getElementById("incidents");

    container.innerHTML = "";

    incidents.forEach(incident => {

        const card =
            document.createElement("div");

        card.className = "incident-card";

        card.innerHTML = `
            <h3>${escapeHtml(incident.title)}</h3>

            <p>${escapeHtml(incident.description)}</p>

            <span class="status">
                ${escapeHtml(incident.status)}
            </span>

            <div class="buttons">

                <button onclick="analyzeIncident(${incident.id}, this)">
                    Analyze with AI
                </button>

                <button
                    class="delete"
                    onclick="deleteIncident(${incident.id})"
                >
                    Delete
                </button>

            </div>

            <pre
                class="analysis"
                id="analysis-${incident.id}"
            ></pre>
        `;

        container.appendChild(card);

    });

}


async function createIncident() {

    const title =
        document.getElementById("title").value;

    const description =
        document.getElementById("description").value;

    if (!title || !description) {
        alert("Please enter title and description.");
        return;
    }

    await fetch("/api/incidents", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            title,
            description
        })

    });

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";

    loadIncidents();
}


async function analyzeIncident(id, button) {

    const output =
        document.getElementById(`analysis-${id}`);

    output.textContent =
        "AI is analyzing the incident...";

    button.disabled = true;

    try {

        const response =
            await fetch(`/api/analyze/${id}`, {
                method: "POST"
            });

        const data =
            await response.json();

        if (!response.ok) {
            output.textContent =
                data.error || "AI request failed.";
            return;
        }

        output.textContent =
            data.analysis;

    }

    catch (error) {

        output.textContent =
            "Unable to connect to AI service.";

    }

    finally {

        button.disabled = false;

    }
}


async function deleteIncident(id) {

    await fetch(
        `/api/incidents/${id}`,
        {
            method: "DELETE"
        }
    );

    loadIncidents();
}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


loadIncidents();

</script>

</body>

</html>
